name: HACS Action

on:
  push:
  pull_request:

jobs:
  validate-hacs:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'
      - name: HACS validation
        uses: 'hacs/action@main'
        with:
          category: 'plugin'
          # Repo topics are GitHub settings (not in-tree). Cursor token cannot set them;
          # owner should add: home-assistant, hacs, lovelace, custom-card. Ignore until then.
          ignore: topics
