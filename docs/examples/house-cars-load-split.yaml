# House vs cars load-flow split — prefer compact + wide.
# Hierarchy: total load → Cars → (Tesla, Puma) and House → (Heat Pump, Sunamp).
# Do NOT map these into load.additional_loads / essential_load1–4.
type: custom:detailed-power-flow-card
cardstyle: compact
wide: true
title: House & cars load split
show_solar: true
show_battery: true
show_grid: true

load_groups:
  show_split: true
  house_entity: sensor.house_load_power
  car_entity: sensor.ev_total_charge_power
  house_name: House
  car_name: Cars

# Nested under the House hub only
large_loads:
  - id: heat_pump
    name: Heat Pump
    entity: sensor.heat_pump_power
    icon: mdi:heat-pump
    max_threshold: 5000
  - id: sunamp
    name: Sunamp
    entity: sensor.sunamp_power
    icon: mdi:water-boiler

# Nested under the Cars hub only
car_loads:
  - id: tesla
    name: Tesla
    entity: sensor.tesla_charge_power
    icon: mdi:car-electric
  - id: puma
    name: Puma
    entity: sensor.ford_puma_charge_power
    icon: mdi:car

# Optional overrides — defaults already use car / home / heat-pump / propane-tank.
icons:
  house: mdi:home
  car: mdi:car
  heat_pump: mdi:heat-pump
  sunamp: mdi:propane-tank
  tesla: mdi:car
  puma: mdi:car

load:
  colour: '#5fb6ad'
  dynamic_colour: true
  show_daily: true
  auto_scale: true
  # Keep at 0 — split owns this area; essential_load1–N are not used for cars/house.
  additional_loads: 0
  show_aux: false

solar:
  mppts: 2
  colour: '#ffa500'

battery:
  energy: 10000
  shutdown_soc: 20
  colour: '#ffc0cb'

grid:
  show_nonessential: false
  colour: '#5490c2'

entities:
  inverter_power_175: sensor.inverter_power
  inverter_status_59: sensor.inverter_status
  essential_power: sensor.total_load_power
  day_load_energy_84: sensor.daily_load_energy
  battery_soc_184: sensor.battery_soc
  battery_power_190: sensor.battery_power
  battery_current_191: sensor.battery_current
  grid_ct_power_172: sensor.grid_ct_power
  grid_power_169: sensor.grid_power
  pv1_power_186: sensor.pv1_power
  pv2_power_187: sensor.pv2_power
  day_pv_energy_108: sensor.daily_pv_energy
  day_battery_charge_70: sensor.daily_battery_charge
  day_battery_discharge_71: sensor.daily_battery_discharge
  day_grid_import_76: sensor.daily_grid_import
  day_grid_export_77: sensor.daily_grid_export
