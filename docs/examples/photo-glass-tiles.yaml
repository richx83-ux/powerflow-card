# Photo-background glass-tile power flow (default cardstyle: photo).
# Place a house photo in /config/www/ (or use a /media/ URL), then point
# background_image at it. Omit background_image for a dusk gradient placeholder.
#
# type stays custom:detailed-power-flow-card. Use cardstyle: classic (or lite /
# compact / full) for the legacy SVG inverter diagram.
type: custom:detailed-power-flow-card
cardstyle: photo
title: Home power
background_image: /local/house-dusk.jpg
background_fit: cover

photo:
  tile_opacity: 0.55
  tile_blur: 12
  flow_style: manhattan # or curved
  flow_threshold: 5
  accent: '#5fb6ad'

show_solar: true
show_battery: true
show_grid: true

load_groups:
  show_split: true
  house_entity: sensor.house_load_power
  car_entity: sensor.ev_total_charge_power
  house_name: House
  car_name: Cars

large_loads:
  - id: heat_pump
    name: Heat Pump
    entity: sensor.heat_pump_power
    icon: mdi:heat-pump
    max_threshold: 5000
  - id: sunamp
    name: Sunamp
    entity: sensor.sunamp_power
    icon: mdi:propane-tank

car_loads:
  - id: tesla
    name: Model Y
    entity: sensor.tesla_charge_power
    icon: mdi:car
  - id: puma
    name: Puma
    entity: sensor.ford_puma_charge_power
    icon: mdi:car

# Known ids use built-in stroke line-art (tesla, puma, heat_pump, sunamp, house, car).
icons:
  house: mdi:home
  car: mdi:car
  heat_pump: mdi:heat-pump
  sunamp: mdi:propane-tank
  tesla: mdi:car
  puma: mdi:car

load:
  colour: '#5fb6ad'
  dynamic_colour: true
  show_daily: true
  auto_scale: true
  additional_loads: 0
  show_aux: false

solar:
  mppts: 2
  colour: '#ffa500'
  max_power: 8000

battery:
  energy: 10000
  shutdown_soc: 20
  colour: '#ffc0cb'
  max_power: 5000

grid:
  show_nonessential: false
  colour: '#5490c2'
  grid_name: Grid

entities:
  inverter_power_175: sensor.inverter_power
  inverter_status_59: sensor.inverter_status
  essential_power: sensor.total_load_power
  day_load_energy_84: sensor.daily_load_energy
  battery_soc_184: sensor.battery_soc
  battery_power_190: sensor.battery_power
  battery_current_191: sensor.battery_current
  grid_ct_power_172: sensor.grid_ct_power
  grid_power_169: sensor.grid_power
  pv1_power_186: sensor.pv1_power
  pv2_power_187: sensor.pv2_power
  day_pv_energy_108: sensor.daily_pv_energy
  day_battery_charge_70: sensor.daily_battery_charge
  day_battery_discharge_71: sensor.daily_battery_discharge
  day_grid_import_76: sensor.daily_grid_import
  day_grid_export_77: sensor.daily_grid_export
